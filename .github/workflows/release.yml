name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Checksum
        run: cd dist && shasum -a 256 tidy-macos-arm64 > checksums.txt
      # v0.x tags publish as pre-release; drop the flag once 1.0 ships.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/tidy-macos-arm64 dist/checksums.txt
          --title "${{ github.ref_name }}" --generate-notes
          ${{ startsWith(github.ref_name, 'v0.') && '--prerelease' || '' }}
