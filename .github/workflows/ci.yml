name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported release target builds and tests on a native runner.
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - name: Build ${{ matrix.target }}
        run: bash scripts/build.sh ${{ matrix.target }}
      - name: Exercise the install script for ${{ matrix.target }}
        run: bash scripts/install.test.sh
