name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported release target builds and tests on a native runner.
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - name: Build ${{ matrix.target }}
        run: bash scripts/build.sh ${{ matrix.target }}
      # Drive the built Linux x64 artifact through the reported acceptance findings in a throwaway
      # HOME. Strict mode turns an environmental skip (for example a non-stock Yama setting) into a
      # failure so a release gate cannot pass without the trace coverage.
      - name: Linux release acceptance for ${{ matrix.target }}
        if: matrix.target == 'linux-x64'
        env:
          TRET_ACCEPTANCE_STRICT: "1"
        run: bun scripts/linux-acceptance.ts
      # The ubuntu runner has passwordless sudo, so only linux-x64 runs the root install and uninstall.
      - name: Privileged install and uninstall for ${{ matrix.target }}
        if: matrix.target == 'linux-x64'
        run: bash scripts/privileged-e2e.sh
      - name: Exercise the install script for ${{ matrix.target }}
        run: bash scripts/install.test.sh
