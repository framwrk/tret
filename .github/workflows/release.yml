name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Checksum
        run: cd dist && shasum -a 256 tidy-macos-arm64 > checksums.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          dist/tidy-macos-arm64 dist/checksums.txt
          --clobber