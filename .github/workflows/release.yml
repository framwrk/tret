name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Each target is built natively so the archive carries the right bits.
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-13
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - name: Build
        run: bash scripts/build.sh ${{ matrix.target }}
      - name: Exercise the install script
        run: bash scripts/install.test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/tret-${{ matrix.target }}
            dist/tret-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum every artifact
        run: |
          cd dist
          sha256sum tret-* > checksums.txt
          cat checksums.txt
      # v0.x tags publish as pre-release; drop the flag once 1.0 ships.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/tret-darwin-arm64 dist/tret-darwin-arm64.tar.gz
          dist/tret-darwin-x64 dist/tret-darwin-x64.tar.gz
          dist/tret-linux-arm64 dist/tret-linux-arm64.tar.gz
          dist/tret-linux-x64 dist/tret-linux-x64.tar.gz
          dist/checksums.txt
          --title "${{ github.ref_name }}" --generate-notes
          ${{ startsWith(github.ref_name, 'v0.') && '--prerelease' || '' }}
